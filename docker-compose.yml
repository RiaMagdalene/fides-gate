services:
  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
  web:
    build:
      context: .
      dockerfile: artifacts/fides-gate/Dockerfile
      args:
        VITE_API_PREFIX: /api
    environment:
      PORT: 23502
      BASE_PATH: /
    ports:
      - "23502:23502"
    depends_on:
      - api